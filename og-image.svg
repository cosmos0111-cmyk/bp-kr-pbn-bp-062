<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="214" cy="578" r="46" fill="#b91c1c" opacity="0.17"/>
    <circle cx="1258" cy="488" r="31" fill="#b91c1c" opacity="0.12"/>
    <circle cx="987" cy="477" r="63" fill="#b91c1c" opacity="0.07"/>
    <circle cx="788" cy="417" r="33" fill="#b91c1c" opacity="0.11"/>
    <circle cx="257" cy="-50" r="24" fill="#b91c1c" opacity="0.19"/>
    <circle cx="720" cy="348" r="69" fill="#b91c1c" opacity="0.14"/>
    <rect x="618" y="4" width="93" height="95" rx="8" fill="#dc2626" opacity="0.10" transform="rotate(4, 464, 505)"/>
    <rect x="820" y="110" width="76" height="96" rx="8" fill="#dc2626" opacity="0.08" transform="rotate(27, 1181, 494)"/>
    <rect x="615" y="521" width="54" height="73" rx="8" fill="#dc2626" opacity="0.08" transform="rotate(16, 1154, 524)"/>
    <rect x="886" y="595" width="56" height="48" rx="8" fill="#dc2626" opacity="0.13" transform="rotate(40, 1120, 480)"/>
    <rect x="-44" y="-27" width="21" height="31" rx="8" fill="#dc2626" opacity="0.07" transform="rotate(35, 588, 706)"/>
    <rect x="845" y="390" width="75" height="76" rx="8" fill="#dc2626" opacity="0.08" transform="rotate(37, 403, 54)"/>
    <rect x="1124" y="82" width="52" height="96" rx="8" fill="#dc2626" opacity="0.10" transform="rotate(5, 634, 18)"/>
    <rect x="525" y="-38" width="74" height="63" rx="8" fill="#dc2626" opacity="0.07" transform="rotate(8, 1157, 603)"/>
    <polygon points="118,514 169,616 67,616" fill="#b91c1c" opacity="0.04"/>
    <polygon points="1017,87 1055,163 979,163" fill="#b91c1c" opacity="0.10"/>
    <polygon points="174,-18 267,168 81,168" fill="#b91c1c" opacity="0.08"/>
    <polygon points="337,19 384,113 290,113" fill="#b91c1c" opacity="0.04"/>

  <!-- Wave at bottom -->
  <path d="M0,532 C360,581 840,483 1200,532 L1200,630 L0,630Z" fill="#b91c1c" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    경기 쇼핑몰 제작 비용
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    경기 — 쇼핑몰 제작
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fbbf24" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    경기 경기 쇼핑몰 제작 비용 — 쇼핑몰 제작
  </text>
</svg>